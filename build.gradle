// Top-level build file for Notification Controller v1.5.
// The app is built on GitHub Actions (see .github/workflows/android.yml):
// Gradle does not run in the local sandbox (Java TCP is blocked there).
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'com.google.gms.google-services' version '4.4.2' apply false
}
